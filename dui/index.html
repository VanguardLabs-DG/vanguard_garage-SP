<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom DUI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="card">
            <div class="header">
                <div class="brand-box">MRI</div>
                <div class="title-section">
                    <h1 id="vehicle-name">VEHICLE NAME</h1>
                    <div class="plate-box">
                        <span id="vehicle-plate">ABC-1234</span>
                    </div>
                </div>
            </div>

            <div class="stats-container">
                <!-- Fuel -->
                <div class="stat-row">
                    <div class="stat-info">
                        <div class="stat-label">
                            <svg class="icon" viewBox="0 0 512 512" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M32 64C32 28.7 60.7 0 96 0H256c35.3 0 64 28.7 64 64V256h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H320v56c0 44.2 35.8 80 80 80s80-35.8 80-80V288c0-53-43-96-96-96c-13.3 0-24-10.7-24-24s10.7-24 24-24c79.5 0 144 64.5 144 144v112c0 70.7-57.3 128-128 128s-128-57.3-128-128V304H96c-35.3 0-64-28.7-64-64V64zM64 64V240c0 17.7 14.3 32 32 32H256c17.7 0 32-14.3 32-32V64c0-17.7-14.3-32-32-32H96C78.3 32 64 46.3 64 64zM160 80h32c8.8 0 16 7.2 16 16v32c0 8.8-7.2 16-16 16H160c-8.8 0-16-7.2-16-16V96c0-8.8 7.2-16 16-16z"/>
                            </svg>
                            <span>COMBUSTÍVEL</span>
                        </div>
                        <span class="stat-value" id="fuel-value">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill fuel" id="fuel-fill"></div>
                    </div>
                </div>

                <!-- Engine -->
                <div class="stat-row">
                    <div class="stat-info">
                        <div class="stat-label">
                            <svg class="icon" viewBox="0 0 640 512" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M480 80c0-26.5-21.5-48-48-48s-48 21.5-48 48s21.5 48 48 48s48-21.5 48-48zM0 224c0 35.3 28.7 64 64 64h1.1c7.9 31.2 31.2 56.4 62.4 64.1l32.5 8.1c11.3 2.8 23 4.2 34.7 4.2h36l26.2 39.3c14.1 21.2 37.9 33.9 63.4 33.9h121.3c25.5 0 49.3-12.7 63.4-33.9l26.2-39.3H520c35.3 0 64-28.7 64-64V224c0-35.3-28.7-64-64-64h-38.3l-26.2-39.3c-14.1-21.2-37.9-33.9-63.4-33.9H266.9c-25.5 0-49.3 12.7-63.4 33.9l-26.2 39.3H128c-35.3 0-64 28.7-64 64h-1.1c-31.2 7.7-54.6 32.9-62.4 64.1H64c-35.3 0-64-28.7-64-64zM320 160c53 0 96 43 96 96s-43 96-96 96s-96-43-96-96s43-96 96-96z"/>
                            </svg>
                            <span>MOTOR</span>
                        </div>
                        <span class="stat-value" id="engine-value">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill engine" id="engine-fill"></div>
                    </div>
                </div>

                <!-- Body -->
                <div class="stat-row">
                    <div class="stat-info">
                        <div class="stat-label">
                            <svg class="icon" viewBox="0 0 512 512" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L7.4 289.2C2.6 303 12.9 317.7 27.3 317.7H32c17.7 0 32 14.3 32 32v32c0 17.7 14.3 32 32 32h32c17.7 0 32-14.3 32-32V352H352v32c0 17.7 14.3 32 32 32h32c17.7 0 32-14.3 32-32V352c0-17.7 14.3-32 32-32h4.7c14.4 0 24.7-14.7 19.9-28.5L472.4 196.8c-3.2-9.3-11.9-15.5-21.8-15.5H61.4c-9.9 0-18.6 6.2-21.8 15.5zM80 272a16 16 0 1 1 32 0 16 16 0 1 1 -32 0zm320 16a16 16 0 1 1 0-32 16 16 0 1 1 0 32z"/>
                            </svg>
                            <span>LATARIA</span>
                        </div>
                        <span class="stat-value" id="body-value">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill body" id="body-fill"></div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <span class="status-text">PRONTO PARA TEST-DRIVE</span>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
