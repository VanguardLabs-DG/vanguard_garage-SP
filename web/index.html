<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Garage - Luxury Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ---- Design Tokens MRI_ESC ---- */
        :root {
            --d900: #05050E;
            --d800: #0A0A18;
            --blue: #0094E1;
            --blue-glow: rgba(0, 148, 225, 0.6);
            --orange: #FF8F00;
            --orange-glow: rgba(255, 143, 0, 0.4);
            --t1: #FFFFFF;
            --t2: #D1D1FF;
            --t3: #8B8BB9;
            --glass-b: rgba(255, 255, 255, 0.08);
            --green: #00E676;
            --red: #FF4757;
        }

        /* ---- Custom Scrollbar ---- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--blue); }

        /* ---- Optimized Layout & Animations ---- */
        body, html { 
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; 
            background: transparent !important; font-family: 'Sora', 'Urbanist', sans-serif; 
            -webkit-user-select: none; user-select: none; 
            image-rendering: -webkit-optimize-contrast; /* Melhor nitidez para NUI */
        }
        [x-cloak] { display: none !important; }

        .app-wrapper {
            position: fixed; inset: 0;
            display: flex; justify-content: flex-start;
            z-index: 10;
            perspective: 1000px; /* Prepara para efeitos 3D se necessário */
        }

        .sidebar {
            width: 700px; /* Reduzido levemente para otimizar preenchimento */
            height: 100vh;
            background: linear-gradient(to right, 
                rgba(5, 5, 14, 1.0) 0%, 
                rgba(5, 5, 14, 1.0) 350px, 
                rgba(5, 5, 14, 0.95) 450px,
                rgba(5, 5, 14, 0.4) 600px,
                transparent 100%);
            display: flex; flex-direction: column;
            position: relative;
            will-change: transform, opacity;
            transform: translate3d(0,0,0); /* Força camada de hardware */
            backface-visibility: hidden;
            animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            overflow: hidden;
            contain: content; /* Isola o elemento para o navegador não recalcular o resto da página */
        }

        .sidebar-glow {
            position: absolute;
            top: 0; left: 0;
            width: 250px;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 148, 225, 0.15) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            transition: background 0.4s ease;
        }
        .is-impound .sidebar-glow {
            background: linear-gradient(to right, rgba(255, 143, 0, 0.12) 0%, transparent 100%);
        }

        .sidebar-line {
            position: absolute;
            top: 0; left: 0;
            width: 3px;
            height: 100%;
            background: var(--blue);
            box-shadow: 0 0 15px 1px var(--blue-glow);
            z-index: 10;
            transition: background 0.4s, box-shadow 0.4s;
        }
        .is-impound .sidebar-line {
            background: var(--orange);
            box-shadow: 0 0 15px 1px var(--orange-glow);
        }

        @keyframes slideIn { 
            from { transform: translate3d(-100%, 0, 0); opacity: 0; } 
            to { transform: translate3d(0, 0, 0); opacity: 1; } 
        }

        .content-container {
            width: 400px;
            height: 100%;
            display: flex; flex-direction: column;
            position: relative;
            z-index: 2;
            padding-left: 4px;
        }

        .header { padding: 45px 35px 25px; }
        .logo-wordmark { font-size: 24px; font-weight: 900; letter-spacing: 4px; color: var(--blue); text-shadow: 0 0 15px var(--blue-glow); transition: 0.4s; }
        .is-impound .logo-wordmark { color: var(--orange); text-shadow: 0 0 15px var(--orange-glow); }
        .logo-subtitle { font-size: 9px; font-weight: 600; letter-spacing: 3px; color: var(--t3); text-transform: uppercase; margin-top: 2px; }

        .search-area { padding: 0 35px; margin-bottom: 25px; }
        .search-input-wrap {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-b);
            border-radius: 12px;
            display: flex; align-items: center; padding: 0 16px;
            transition: border-color 0.3s;
        }
        .search-input-wrap:focus-within { border-color: rgba(0, 148, 225, 0.4); }
        .search-input-wrap input {
            background: transparent; border: none; padding: 14px 10px;
            color: var(--t1); width: 100%; outline: none; font-family: inherit; font-size: 13px;
        }

        .vehicle-list { 
            flex: 1; overflow-y: auto; padding: 0 25px 20px 35px; 
            contain: layout; /* Otimiza scroll e renderização de lista */
        }
        
        .veh-card {
            background: rgba(10, 10, 24, 0.85); /* Like ESC */
            border: 1px solid var(--glass-b);
            border-radius: 14px; padding: 16px 20px; margin-bottom: 12px;
            cursor: pointer; transition: 0.25s cubic-bezier(0.2, 1, 0.2, 1);
            display: flex; align-items: center; justify-content: flex-start; gap: 15px;
            position: relative;
            backface-visibility: hidden;
            will-change: transform, background;
        }
        .veh-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.12); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35); }
        .veh-card.active { border-color: rgba(0, 148, 225, 0.35); background: linear-gradient(90deg, rgba(0, 148, 225, 0.15), rgba(10, 10, 24, 0.95)); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35), 0 0 30px rgba(0, 148, 225, 0.15); }
        .is-impound .veh-card.active { border-color: rgba(255, 143, 0, 0.35); background: linear-gradient(90deg, rgba(255, 143, 0, 0.15), rgba(10, 10, 24, 0.95)); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35), 0 0 30px rgba(255, 143, 0, 0.15); }
        
        .veh-card-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: rgba(0, 148, 225, 0.1); color: var(--blue);
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            flex-shrink: 0; transition: 0.3s;
        }
        .is-impound .veh-card-icon { background: rgba(255, 143, 0, 0.1); color: var(--orange); }
        .veh-card.active .veh-card-icon { background: var(--blue-glow); color: #fff; box-shadow: 0 0 15px var(--blue-glow); }
        .is-impound .veh-card.active .veh-card-icon { background: var(--orange-glow); color: #fff; box-shadow: 0 0 15px var(--orange-glow); }

        .veh-card.active::before { 
            content: ''; position: absolute; left: 0; top: 25%; height: 50%; width: 3px; 
            background: var(--blue); border-radius: 0 4px 4px 0; box-shadow: 0 0 12px var(--blue); 
        }
        .is-impound .veh-card.active::before { background: var(--orange); box-shadow: 0 0 12px var(--orange); }

        .veh-card-info { flex: 1; }
        .veh-card-info h3 { font-size: 14px; font-weight: 800; letter-spacing: 1px; margin: 0; color: var(--t1); text-transform: uppercase; }
        .veh-card-info p { font-size: 10px; font-weight: 600; color: var(--t3); margin: 3px 0 0; font-family: 'Urbanist'; letter-spacing: 2px; }

        .price-badge {
            background: rgba(255, 143, 0, 0.1);
            color: var(--orange);
            border: 1px solid var(--orange-glow);
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 900;
        }

        /* Details Panel */
        .details-panel {
            background: linear-gradient(180deg, var(--d900) 0%, #080814 100%);
            padding: 35px 30px;
            border-top: 2px solid var(--blue);
            border-radius: 35px 35px 0 0;
            box-shadow: 0 -15px 40px rgba(0, 148, 225, 0.25), 0 -25px 60px rgba(0,0,0,0.9);
            position: absolute; bottom: 0; left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 5;
            max-height: 65vh;
            overflow-y: auto;
            will-change: transform, opacity;
            backface-visibility: hidden;
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            contain: layout;
            transition: border-color 0.4s;
        }

        .is-impound .details-panel { 
            border-top-color: var(--orange); 
            box-shadow: 0 -15px 40px rgba(255, 143, 0, 0.25), 0 -25px 60px rgba(0,0,0,0.9);
        }

        @keyframes slideUp { 
            from { transform: translate3d(0, 100%, 0); opacity: 0; } 
            to { transform: translate3d(0, 0, 0); opacity: 1; } 
        }

        .veh-name-title { 
            font-size: 20px; font-weight: 900; letter-spacing: -0.5px; color: var(--t1); margin: 0; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%; display: block; text-align: center;
        }
        .details-header-sep {
            height: 1px; width: 100%;
            background: linear-gradient(90deg, transparent 5%, rgba(255, 255, 255, 0.4) 50%, transparent 95%);
            margin: 12px 0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }
        .veh-plate-pill { 
            position: relative;
            display: inline-flex; align-items: center; justify-content: center;
            width: 135px; height: 46px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }
        .veh-plate-pill img { 
            width: 100%; height: 100%; object-fit: contain; 
            image-rendering: -webkit-optimize-contrast;
        }
        .veh-plate-pill span {
            position: absolute;
            top: 57%; /* Precision centering in the white area */
            left: 50%;
            transform: translate(-50%, -50%);
            color: #111;
            font-size: 19px; font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-shadow: 0 0 1px rgba(0,0,0,0.1);
        }
        .is-impound .veh-plate-pill { filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }

        .plate-section-wrap {
            width: 100%; margin: 20px 0; padding: 18px 0;
            display: flex; justify-content: center; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 148, 225, 0.12);
            position: relative;
            /* Creates the perfect fade at the ends for everything inside */
            -webkit-mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
        }
        .is-impound .plate-section-wrap {
            background: rgba(255, 143, 0, 0.12);
        }
        .preview-box { 
            height: 140px; display: flex; align-items: center; justify-content: center; margin: 15px 0 25px; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        .preview-box img { max-width: 90%; max-height: 90%; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5)); }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card {
            background: rgba(10, 10, 24, 0.95);
            border-radius: 10px; padding: 10px 12px;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-3px); }
        
        .stat-icon-wrap {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 13px;
            flex-shrink: 0;
        }
        
        /* Vibrant Color Diversity for Icons & Persistent Borders */
        .si-gold { background: rgba(255, 170, 0, 0.1); color: #FFAA00; }
        .stat-card-gold { border: 1px solid rgba(255, 170, 0, 0.2) !important; }
        .stat-card-gold:hover { border-color: rgba(255, 170, 0, 0.6) !important; box-shadow: 0 0 25px rgba(255, 170, 0, 0.2); }

        .si-blue { background: rgba(0, 148, 225, 0.1); color: var(--blue); }
        .stat-card-blue { border: 1px solid rgba(0, 148, 225, 0.2) !important; }
        .stat-card-blue:hover { border-color: rgba(0, 148, 225, 0.6) !important; box-shadow: 0 0 25px rgba(0, 148, 225, 0.2); }

        .si-purple { background: rgba(168, 85, 247, 0.1); color: #A855F7; }
        .stat-card-purple { border: 1px solid rgba(168, 85, 247, 0.2) !important; }
        .stat-card-purple:hover { border-color: rgba(168, 85, 247, 0.6) !important; box-shadow: 0 0 25px rgba(168, 85, 247, 0.2); }

        .si-green { background: rgba(0, 230, 118, 0.1); color: var(--green); }
        .stat-card-green { border: 1px solid rgba(0, 230, 118, 0.2) !important; }
        .stat-card-green:hover { border-color: rgba(0, 230, 118, 0.6) !important; box-shadow: 0 0 25px rgba(0, 230, 118, 0.2); }

        .si-red { background: rgba(255, 71, 87, 0.1); color: var(--red); }
        .stat-card-red { border: 1px solid rgba(255, 71, 87, 0.2) !important; }
        .stat-card-red:hover { border-color: rgba(255, 71, 87, 0.6) !important; box-shadow: 0 0 25px rgba(255, 71, 87, 0.2); }

        .is-impound .stat-icon-wrap { background: rgba(255, 143, 0, 0.1); color: var(--orange); }
        .is-impound .stat-card { border: 1px solid rgba(255, 143, 0, 0.2) !important; }
        .is-impound .stat-card:hover { border-color: rgba(255, 143, 0, 0.6) !important; box-shadow: 0 0 25px rgba(255, 143, 0, 0.2); }
        
        .stat-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .stat-label { font-size: 8px; font-weight: 800; color: var(--t3); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px; }
        .stat-value { 
            font-size: 14px; font-weight: 900; color: var(--t1); letter-spacing: 0.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-withdraw {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--blue), #1e40af);
            color: #fff; font-weight: 900; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.2, 1); text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 12px 30px rgba(0, 148, 225, 0.35);
            backface-visibility: hidden;
        }
        .btn-withdraw:hover:not(:disabled) { transform: translate3d(0, -5px, 0); box-shadow: 0 20px 45px rgba(0, 148, 225, 0.55); filter: brightness(1.15); }
        .btn-withdraw:active { transform: translate3d(0, 0, 0); }
        .btn-withdraw:disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }

        .btn-impound {
            background: linear-gradient(135deg, var(--orange), #c2410c);
            box-shadow: 0 15px 40px rgba(255, 143, 0, 0.4);
        }
        .btn-impound:hover:not(:disabled) { box-shadow: 0 20px 45px rgba(255, 143, 0, 0.55); }

        .hint-text { margin-top: 20px; text-align: center; font-size: 9px; font-weight: 800; color: var(--t3); letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }

        #tags-iframe { position: fixed; inset: 0; border: none; pointer-events: none; z-index: 100; }
    </style>
</head>
<body x-data="garageApp()">
    
    <iframe src="showroom_tags/index.html" id="tags-iframe" x-cloak></iframe>

    <div class="app-wrapper" x-show="isOpen" :class="{ 'is-impound': isImpound }" x-cloak>
        <div class="sidebar">
            <div class="sidebar-glow"></div>
            <div class="sidebar-line"></div>

            <div class="content-container">
                
                <header class="header">
                    <div class="logo-wordmark" x-text="isImpound ? 'DETRAN' : 'MRI'"></div>
                    <div class="logo-subtitle" x-text="isImpound ? 'PÁTIO DE APREENSÃO' : 'GARAGEM'"></div>
                </header>

                <div class="search-area">
                    <div class="search-input-wrap">
                        <i class="fa-solid fa-search" style="color: var(--t3); font-size: 16px;"></i>
                        <input type="text" placeholder="BUSCAR SEU VEÍCULO..." x-model="search">
                    </div>
                </div>

                <div class="vehicle-list">
                    <!-- Mensagem de Lista Vazia -->
                    <template x-if="filteredVehicles().length === 0">
                        <div class="empty-state">
                            <i class="fa-solid fa-car-on"></i>
                            <p x-text="isImpound ? 'Nenhum veículo apreendido ou em busca' : 'Nenhum veículo encontrado nesta unidade'"></p>
                        </div>
                    </template>

                    <template x-for="veh in filteredVehicles()" :key="veh.plate">
                        <div class="veh-card" :class="{ 'active': selected && selected.plate === veh.plate }" @click="selectVehicle(veh)">
                            <div class="veh-card-icon">
                                <i class="fa-solid fa-car-side"></i>
                            </div>
                            <div class="veh-card-info">
                                <h3 x-text="veh.name"></h3>
                                <p x-text="veh.plate"></p>
                            </div>
                            <div class="price-badge" x-show="isImpound" x-text="'R$ ' + veh.price.toLocaleString('pt-BR')"></div>
                            <i x-show="!isImpound" class="fa-solid fa-chevron-right" style="font-size: 14px; color: var(--glass-b); position: absolute; right: 20px;"></i>
                        </div>
                    </template>
                </div>

                <!-- Details Dialogue -->
                <div class="details-panel" x-show="selected" x-transition:enter="slide-up">
                    <!-- Vehicle Identity Section -->
                    <h1 class="veh-name-title" x-text="selected?.name"></h1>
                    
                    <div class="plate-section-wrap">
                        <div class="veh-plate-pill">
                            <img src="nui://vanguard_garage/web/assets/mercosul.svg">
                            <span x-text="selected?.plate"></span>
                        </div>
                    </div>

                    <div class="preview-box">
                        <template x-if="imageStatus[selected?.plate] !== 'failed'">
                            <img :src="getImgUrl(selected?.model, selected?.plate)" 
                                 @error="onImageError(selected?.plate, selected?.model)" 
                                 loading="lazy">
                        </template>
                        <template x-if="imageStatus[selected?.plate] === 'failed'">
                            <i class="fa-solid fa-car" style="font-size: 70px; color: var(--glass-b); opacity: 0.2;"></i>
                        </template>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card" :class="isImpound ? '' : 'stat-card-gold'">
                            <div class="stat-icon-wrap" :class="isImpound ? '' : 'si-gold'">
                                <i class="fa-solid fa-gas-pump"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-label">Tanque</span>
                                <span class="stat-value" x-text="Math.round(selected?.fuel || 0) + '%'"></span>
                            </div>
                        </div>
                        <div class="stat-card" :class="isImpound ? '' : 'stat-card-purple'">
                            <div class="stat-icon-wrap" :class="isImpound ? '' : 'si-purple'">
                                <i class="fa-solid fa-microchip"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-label">Motor</span>
                                <span class="stat-value" x-text="Math.round((selected?.engine || 0)/10) + '%'"></span>
                            </div>
                        </div>
                        <div class="stat-card" :class="isImpound ? '' : 'stat-card-blue'">
                            <div class="stat-icon-wrap" :class="isImpound ? '' : 'si-blue'">
                                <i class="fa-solid fa-car-burst"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-label">Lataria</span>
                                <span class="stat-value" x-text="Math.round((selected?.body || 0)/10) + '%'"></span>
                            </div>
                        </div>
                        <div class="stat-card" :class="isImpound ? '' : (selected?.state === 1 && selected?.state_text !== 'Quebrado' ? 'stat-card-green' : 'stat-card-red')">
                            <div class="stat-icon-wrap" :class="isImpound ? '' : (selected?.state === 1 && selected?.state_text !== 'Quebrado' ? 'si-green' : 'si-red')">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-label">Status</span>
                                <span class="stat-value" :style="'color:' + (selected?.state_text === 'Quebrado' ? 'var(--red)' : (selected?.state === 1 ? 'var(--green)' : 'var(--red)'))" x-text="selected?.state_text"></span>
                            </div>
                        </div>
                    </div>

                    <button class="btn-withdraw" :class="{ 'btn-impound': isImpound }" @click="spawn()">
                        <template x-if="!isImpound">
                            <i class="fa-solid fa-key"></i>
                        </template>
                        <template x-if="isImpound">
                            <i class="fa-solid fa-hand-holding-dollar"></i>
                        </template>
                        <span x-text="isImpound ? 'PAGAR E RECUPERAR' : 'RETIRAR VEÍCULO'"></span>
                    </button>

                    <div class="hint-text">ESC PARA FECHAR</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const Nui = {
            async post(action, data = {}) {
                const resName = GetParentResourceName ? GetParentResourceName() : 'vanguard_garage';
                try {
                    const resp = await fetch(`https://${resName}/${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    return await resp.json();
                } catch (e) { return { error: true }; }
            }
        };

        function garageApp() {
            return {
                isOpen: false,
                isImpound: false,
                vehicles: [],
                search: '',
                selected: null,
                garageName: '',
                imageStatus: {},

                init() {
                    window.addEventListener('message', (event) => {
                        const item = event.data;
                        if (item.action === 'open') {
                            this.vehicles = item.vehicles || [];
                            this.garageName = item.garage;
                            this.isImpound = item.isImpound || false;
                            this.isOpen = true;
                            this.selected = null;
                            this.imageStatus = {};
                        }
                        if (item.action === 'close') this.isOpen = false;
                    });
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.isOpen) {
                            if (this.selected) {
                                this.selected = null;
                            } else {
                                this.close();
                            }
                        }
                    });
                },

                filteredVehicles() {
                    if (!this.search) return this.vehicles;
                    const s = this.search.toLowerCase();
                    return this.vehicles.filter(v => v.name.toLowerCase().includes(s) || v.plate.toLowerCase().includes(s));
                },

                selectVehicle(v) { this.selected = v; },

                getImgUrl(model, plate) {
                    if (!model) return '';
                    const status = this.imageStatus[plate];
                    const lower = model.toLowerCase();
                    if (status === 'nui-PNG') return `vehicles/${lower}.PNG`;
                    if (status === 'primary') return `https://cfx-nui-ox_inventory/web/images/${lower}.png`;
                    if (status === 'fallback') return `https://docs.fivem.net/vehicles/${lower}.webp`;
                    return `vehicles/${lower}.png`;
                },

                onImageError(plate, model) {
                    const status = this.imageStatus[plate];
                    if (!status) this.imageStatus[plate] = 'nui-PNG';
                    else if (status === 'nui-PNG') this.imageStatus[plate] = 'primary';
                    else if (status === 'primary') this.imageStatus[plate] = 'fallback';
                    else if (status === 'fallback') this.imageStatus[plate] = 'failed';
                    this.imageStatus = { ...this.imageStatus };
                },

                spawn() {
                    if (!this.selected) return;
                    Nui.post('takeOutVehicle', { 
                        plate: this.selected.plate, 
                        garage: this.garageName,
                        price: this.selected.price,
                        model: this.selected.model,
                        name: this.selected.name
                    });
                    this.close();
                },

                close() {
                    this.isOpen = false;
                    Nui.post('closeUI');
                }
            }
        }
    </script>
</body>
</html>
