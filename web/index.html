<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garagem - Vanguard</title>
    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
    <!-- Google Fonts: Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ---- RESET & CORE DESIGN TOKENS ---- */
        :root {
            --bg-modal: #101114;
            --bg-left: #0F1013;
            --bg-right: #0C0D10;
            --bg-card: #141519;
            --bg-card-hover: #191B20;
            --bg-input: #15161A;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(255, 184, 0, 0.6);
            
            --yellow: #FFB800;
            --yellow-hover: #E5A600;
            --yellow-glow: rgba(255, 184, 0, 0.25);
            
            --red-esc: #DC2626;
            --red-esc-hover: #B91C1C;
            
            --track-bar: #202126;
            --text-white: #FFFFFF;
            --text-muted: #71717A;
            --text-dim: #A1A1AA;
            
            --radius-lg: 18px;
            --radius-md: 10px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            image-rendering: -webkit-optimize-contrast;
        }

        [x-cloak] { display: none !important; }

        /* ---- SCROLLBAR ---- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 184, 0, 0.5); }

        /* ---- APP CONTAINER ---- */
        .app-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ---- MAIN MODAL (1:1 with reference) ---- */
        .app-modal {
            width: 1040px;
            height: 620px;
            max-width: 95vw;
            max-height: 94vh;
            background: var(--bg-modal);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ========================================================
           LEFT PANEL: SHOWCASE, STATS, ACTIONS
           ======================================================== */
        .left-panel {
            width: 420px;
            height: 100%;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            background: var(--bg-left);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Left Header */
        .left-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        .header-icon {
            color: var(--yellow);
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-white);
            letter-spacing: 0.5px;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Showcase Preview - Estendida com fade-out nas extremidades (sem moldura) */
        .preview-showcase {
            width: calc(100% + 48px);
            margin-left: -24px;
            margin-right: -24px;
            margin-top: -12px;
            margin-bottom: -10px;
            height: 245px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            border: none;
            box-shadow: none;
            -webkit-mask-image: linear-gradient(180deg, 
                transparent 0%, 
                rgba(0, 0, 0, 0.25) 5%,
                rgba(0, 0, 0, 0.75) 14%, 
                #000 24%, 
                #000 74%, 
                rgba(0, 0, 0, 0.75) 86%, 
                rgba(0, 0, 0, 0.25) 95%, 
                transparent 100%
            );
            mask-image: linear-gradient(180deg, 
                transparent 0%, 
                rgba(0, 0, 0, 0.25) 5%,
                rgba(0, 0, 0, 0.75) 14%, 
                #000 24%, 
                #000 74%, 
                rgba(0, 0, 0, 0.75) 86%, 
                rgba(0, 0, 0, 0.25) 95%, 
                transparent 100%
            );
            flex-shrink: 0;
        }

        .preview-showcase .stage-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 54%;
            display: block;
            pointer-events: none;
        }

        /* Vehicle Identity (VEÍCULO + Placa Mercosul) */
        .preview-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 0 0 14px;
            position: relative;
            z-index: 2;
        }

        .veh-title {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            line-height: 1.1;
        }

        /* ---- MERCOSUL LICENSE PLATE COMPONENT ---- */
        .plate-mercosul {
            display: inline-flex;
            flex-direction: column;
            width: 78px;
            height: 27px;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            border: 1px solid #1a1a1a;
            flex-shrink: 0;
            background: #ffffff;
        }

        .plate-mercosul .plate-top {
            height: 9px;
            background: #003399;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 3px;
        }

        .plate-mercosul .plate-top .plate-country {
            color: #ffffff;
            font-size: 6px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
        }

        .plate-mercosul .plate-top .plate-flag {
            position: absolute;
            right: 3px;
            width: 8px;
            height: 5px;
            display: flex;
        }

        .plate-mercosul .plate-bottom {
            flex: 1;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 3px;
        }

        .plate-mercosul .plate-bottom .plate-br {
            position: absolute;
            left: 3px;
            color: #000000;
            font-size: 5px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .plate-mercosul .plate-bottom .plate-text {
            color: #000000;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            line-height: 1;
        }

        /* Large Mercosul for Showcase */
        .plate-mercosul.plate-large {
            width: 98px;
            height: 33px;
            border-radius: 4px;
        }

        .plate-mercosul.plate-large .plate-top {
            height: 10px;
        }

        .plate-mercosul.plate-large .plate-top .plate-country {
            font-size: 7px;
            letter-spacing: 1.5px;
        }

        .plate-mercosul.plate-large .plate-top .plate-flag {
            width: 10px;
            height: 6px;
            right: 4px;
        }

        .plate-mercosul.plate-large .plate-bottom .plate-br {
            font-size: 6px;
            left: 4px;
        }

        .plate-mercosul.plate-large .plate-bottom .plate-text {
            font-size: 13px;
            letter-spacing: 1.5px;
        }

        /* ---- VEHICLE STATS (4 rows) ---- */
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            font-size: 15px;
            flex-shrink: 0;
        }

        .stat-icon-img {
            width: 17px;
            height: 17px;
            object-fit: contain;
            filter: invert(86%) sepia(49%) saturate(497%) hue-rotate(352deg) brightness(103%) contrast(104%);
        }

        .stat-label {
            width: 82px;
            font-size: 10.5px;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .stat-bar-track {
            flex: 1;
            height: 7px;
            background: var(--track-bar);
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--yellow);
            border-radius: 4px;
            transition: width 0.3s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .stat-val {
            width: 38px;
            text-align: right;
            font-size: 10.5px;
            font-weight: 800;
            color: var(--text-white);
            flex-shrink: 0;
        }

        /* ---- ACTION BUTTONS (Bottom Left) ---- */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .btn-primary {
            width: 100%;
            height: 42px;
            background: var(--yellow);
            color: #090A0C;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.2, 1, 0.2, 1);
            box-shadow: 0 4px 14px rgba(255, 184, 0, 0.22);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--yellow-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 184, 0, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            width: 100%;
            height: 42px;
            background: #17181D;
            color: var(--text-white);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #202228;
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ========================================================
           RIGHT PANEL: SEARCH, LIST, CLOSE
           ======================================================== */
        .right-panel {
            flex: 1;
            height: 100%;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            background: var(--bg-right);
            overflow: hidden;
        }

        /* Top Action Bar */
        .right-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-wrap {
            flex: 1;
            height: 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .search-wrap:focus-within {
            border-color: var(--border-focus);
        }

        .search-wrap i {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-wrap input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-white);
            font-size: 13px;
            font-weight: 500;
            width: 100%;
        }

        .search-wrap input::placeholder {
            color: #555760;
        }

        .btn-filter {
            width: 40px;
            height: 40px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-filter:hover {
            color: var(--text-white);
            border-color: rgba(255, 255, 255, 0.15);
            background: #1E2026;
        }

        .btn-esc {
            height: 40px;
            padding: 0 16px;
            background: var(--red-esc);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-white);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-esc:hover {
            background: var(--red-esc-hover);
            transform: translateY(-1px);
        }

        .btn-esc:active {
            transform: translateY(0);
        }

        /* Vehicle List */
        .vehicle-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Vehicle Card Item */
        .veh-card {
            height: 64px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative;
        }

        .veh-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .veh-card.active {
            border: 1.5px solid var(--yellow);
            box-shadow: 0 0 12px var(--yellow-glow);
            background: #17181D;
        }

        .veh-thumb-wrap {
            width: 82px;
            height: 46px;
            border-radius: 6px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .veh-thumb-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
            display: block;
        }

        .veh-card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            justify-content: center;
        }

        .veh-card-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-white);
            line-height: 1.2;
        }

        .price-badge {
            background: rgba(255, 184, 0, 0.1);
            color: var(--yellow);
            border: 1px solid rgba(255, 184, 0, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
        }

        .veh-card-arrow {
            color: var(--text-muted);
            font-size: 14px;
            transition: color 0.2s;
            margin-left: 4px;
        }

        .veh-card.active .veh-card-arrow {
            color: var(--text-white);
        }

        .veh-card:hover .veh-card-arrow {
            color: var(--text-dim);
        }

        /* Empty State */
        .empty-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            padding: 40px 0;
        }

        .empty-list i {
            font-size: 40px;
            opacity: 0.3;
        }

        .empty-list p {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Hidden tags iframe preserved for backend compatibility */
        #tags-iframe {
            position: fixed;
            inset: 0;
            border: none;
            pointer-events: none;
            z-index: 50;
            display: none;
        }

        /* Vanguard Parking Progress */
        .vanguard-progress-wrap {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            padding: 16px 20px;
            background: rgba(16, 17, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .progress-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .vanguard-bar-bg {
            height: 5px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .vanguard-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--yellow);
            box-shadow: 0 0 10px var(--yellow-glow);
            transition: width 0.1s linear;
        }

        /* Responsive */
        @media (max-height: 720px) {
            .app-modal {
                height: 94vh;
                max-height: 580px;
            }
            .preview-showcase {
                height: 190px;
                margin-top: -8px;
                margin-bottom: -6px;
            }
            .stats-list {
                gap: 7px;
                margin-bottom: 10px;
            }
            .veh-card {
                height: 58px;
            }
        }
    </style>
</head>
<body x-data="garageApp()">

    <!-- Preserved iframe for 3D tags/showroom -->
    <iframe src="showroom_tags/index.html" id="tags-iframe" x-cloak></iframe>

    <!-- Vanguard Progress Modal -->
    <div class="vanguard-progress-wrap" x-show="progress.show" x-transition x-cloak>
        <div class="progress-label" x-text="progress.label"></div>
        <div class="vanguard-bar-bg">
            <div class="vanguard-bar-fill" :style="'width: ' + progress.percent + '%'"></div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-wrapper" x-show="isOpen" x-cloak>
        <div class="app-modal">
            
            <!-- ================= LEFT PANEL ================= -->
            <div class="left-panel">
                <!-- Header -->
                <div class="left-header">
                    <div class="header-icon">
                        <i class="fa-solid fa-car"></i>
                    </div>
                    <div class="header-text">
                        <h1 class="header-title" x-text="isImpound ? 'DETRAN' : 'GARAGEM'">GARAGEM</h1>
                        <span class="header-subtitle" x-text="isImpound ? 'PÁTIO DE APREENSÃO' : 'SEUS VEÍCULOS'">SEUS VEÍCULOS</span>
                    </div>
                </div>

                <!-- Showcase Preview Stage -->
                <div class="preview-showcase">
                    <img src="assets/car_stage.jpg" alt="Showcase Stage" class="stage-img">
                </div>

                <!-- Vehicle Title & Mercosul Plate -->
                <div class="preview-info">
                    <div class="veh-title" x-text="selected?.name || 'VEÍCULO'">VEÍCULO</div>
                    
                    <!-- Mercosul Plate -->
                    <div class="plate-mercosul plate-large">
                        <div class="plate-top">
                            <span class="plate-country">BRASIL</span>
                            <div class="plate-flag">
                                <svg viewBox="0 0 20 14" style="width:100%;height:100%;">
                                    <rect width="20" height="14" fill="#009b3a"/>
                                    <polygon points="10,1 18,7 10,13 2,7" fill="#fedf00"/>
                                    <circle cx="10" cy="7" r="3.2" fill="#002776"/>
                                </svg>
                            </div>
                        </div>
                        <div class="plate-bottom">
                            <span class="plate-br">BR</span>
                            <span class="plate-text" x-text="selected?.plate || 'ABC1D23'">ABC1D23</span>
                        </div>
                    </div>
                </div>

                <!-- Vehicle Stats -->
                <div class="stats-list">
                    <!-- MOTOR -->
                    <div class="stat-row">
                        <div class="stat-icon">
                            <img src="assets/engine.png" class="stat-icon-img" alt="Motor">
                        </div>
                        <div class="stat-label">MOTOR</div>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill" :style="'width: ' + Math.min(100, Math.max(0, Math.round((selected?.engine || 0)/10))) + '%'"></div>
                        </div>
                        <div class="stat-val" x-text="Math.min(100, Math.max(0, Math.round((selected?.engine || 0)/10))) + '%'">99%</div>
                    </div>

                    <!-- LATARIA -->
                    <div class="stat-row">
                        <div class="stat-icon">
                            <img src="assets/body.png" class="stat-icon-img" alt="Lataria">
                        </div>
                        <div class="stat-label">LATARIA</div>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill" :style="'width: ' + Math.min(100, Math.max(0, Math.round((selected?.body || 0)/10))) + '%'"></div>
                        </div>
                        <div class="stat-val" x-text="Math.min(100, Math.max(0, Math.round((selected?.body || 0)/10))) + '%'">99%</div>
                    </div>

                    <!-- GASOLINA -->
                    <div class="stat-row">
                        <div class="stat-icon">
                            <img src="assets/fuel.png" class="stat-icon-img" alt="Gasolina">
                        </div>
                        <div class="stat-label">GASOLINA</div>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill" :style="'width: ' + Math.min(100, Math.max(0, Math.round(selected?.fuel || 0))) + '%'"></div>
                        </div>
                        <div class="stat-val" x-text="Math.min(100, Math.max(0, Math.round(selected?.fuel || 0))) + '%'">80%</div>
                    </div>

                    <!-- PORTA-MALAS -->
                    <div class="stat-row">
                        <div class="stat-icon">
                            <i class="fa-solid fa-suitcase"></i>
                        </div>
                        <div class="stat-label">PORTA-MALAS</div>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill" :style="'width: ' + (selected?.trunk !== undefined ? selected.trunk : 5) + '%'"></div>
                        </div>
                        <div class="stat-val" x-text="(selected?.trunk !== undefined ? selected.trunk : 5) + '%'">5%</div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="actions-group">
                    <!-- Rastrear Veículo no GPS (Quando estiver Fora da Garagem) -->
                    <button class="btn-primary" x-show="selected?.state === 0 && !isImpound" @click="trackVeh()">
                        <i class="fa-solid fa-location-crosshairs"></i>
                        <span>RASTREAR NO GPS</span>
                    </button>

                    <!-- Retirar Veículo -->
                    <button class="btn-primary" x-show="selected?.state !== 0 || isImpound" @click="spawn()" :disabled="!canSpawn()">
                        <i class="fa-solid fa-car"></i>
                        <span x-text="getSpawnButtonText()">RETIRAR VEÍCULO</span>
                    </button>

                    <!-- Guardar Veículo -->
                    <button class="btn-secondary" x-show="!isImpound" @click="storeVeh()" :disabled="!canStore()">
                        <i class="fa-regular fa-bookmark"></i>
                        <span x-text="getStoreButtonText()">GUARDAR VEÍCULO</span>
                    </button>
                </div>
            </div>

            <!-- ================= RIGHT PANEL ================= -->
            <div class="right-panel">
                <!-- Action Bar (Search, Filter, ESC) -->
                <div class="right-header">
                    <div class="search-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" placeholder="Buscar veículo..." x-model="search">
                    </div>
                    <button class="btn-filter" @click="toggleSort()" title="Ordenar">
                        <i class="fa-solid fa-sliders"></i>
                    </button>
                    <button class="btn-esc" @click="close()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>ESC</span>
                    </button>
                </div>

                <!-- Vehicle List -->
                <div class="vehicle-list">
                    <template x-for="(veh, index) in filteredVehicles()" :key="(veh.plate || '') + '_' + (veh.model || '') + '_' + index">
                        <div class="veh-card" 
                             :class="{ 'active': selected && (selected === veh || (selected.model === veh.model && selected.plate === veh.plate)) }" 
                             @click="selectVehicle(veh)">
                            <!-- Thumbnail -->
                            <div class="veh-thumb-wrap">
                                <img src="assets/carro_default.png" alt="Car Thumbnail" class="veh-thumb-img">
                            </div>

                            <!-- Vehicle Info & Mercosul Plate -->
                            <div class="veh-card-info">
                                <div class="veh-card-name" x-text="veh.name || 'Veículo'">Veículo</div>
                                <div class="plate-mercosul">
                                    <div class="plate-top">
                                        <span class="plate-country">BRASIL</span>
                                        <div class="plate-flag">
                                            <svg viewBox="0 0 20 14" style="width:100%;height:100%;">
                                                <rect width="20" height="14" fill="#009b3a"/>
                                                <polygon points="10,1 18,7 10,13 2,7" fill="#fedf00"/>
                                                <circle cx="10" cy="7" r="3.2" fill="#002776"/>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="plate-bottom">
                                        <span class="plate-br">BR</span>
                                        <span class="plate-text" x-text="veh.plate">ABC1D23</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Impound Price Badge -->
                            <div class="price-badge" x-show="isImpound" x-text="'R$ ' + (veh.price || 0).toLocaleString('pt-BR')"></div>

                            <!-- Arrow -->
                            <div class="veh-card-arrow">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </template>

                    <!-- Empty State -->
                    <template x-if="filteredVehicles().length === 0">
                        <div class="empty-list">
                            <i class="fa-solid fa-car"></i>
                            <p x-text="isImpound ? 'Nenhum veículo apreendido' : 'Nenhum veículo encontrado'"></p>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        const Nui = {
            async post(action, data = {}) {
                const resName = window.GetParentResourceName ? window.GetParentResourceName() : 'vanguard_garage';
                try {
                    const resp = await fetch(`https://${resName}/${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    return await resp.json();
                } catch (e) {
                    return { error: true };
                }
            }
        };

        function garageApp() {
            return {
                isOpen: false,
                isImpound: false,
                isProcessing: false,
                vehicles: [],
                search: '',
                sortAsc: true,
                selected: null,
                garageName: '',
                progress: {
                    show: false,
                    label: '',
                    percent: 0
                },

                init() {
                    window.addEventListener('message', (event) => {
                        const item = event.data;
                        if (!item) return;

                        if (item.action === 'open') {
                            this.vehicles = item.vehicles || [];
                            this.garageName = item.garage || 'GARAGEM';
                            this.isImpound = item.isImpound || false;
                            this.isOpen = true;
                            this.search = '';
                            this.isProcessing = false;
                            this.selected = this.vehicles.length > 0 ? this.vehicles[0] : null;
                        }

                        if (item.action === 'close') {
                            this.isOpen = false;
                            this.isProcessing = false;
                        }

                        if (item.action === 'progress') {
                            this.progress.show = true;
                            this.progress.label = item.label;
                            this.progress.percent = item.percent;
                        }

                        if (item.action === 'progressHide') {
                            this.progress.show = false;
                        }
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.isOpen) {
                            this.close();
                        }
                    });

                    // Test mode when viewing in browser outside FiveM
                    if (!window.GetParentResourceName) {
                        setTimeout(() => {
                            window.postMessage({
                                action: 'open',
                                garage: 'GARAGEM',
                                isImpound: false,
                                vehicles: [
                                    { name: 'Veículo', plate: 'ABC1D23', model: 'adder', fuel: 80, engine: 990, body: 990, state: 1, trunk: 5 },
                                    { name: 'Veículo', plate: 'DEF4G56', model: 't20', fuel: 90, engine: 1000, body: 950, state: 1, trunk: 12 },
                                    { name: 'Veículo', plate: 'HIJ7K89', model: 'zentorno', fuel: 65, engine: 900, body: 800, state: 1, trunk: 25 },
                                    { name: 'Veículo', plate: 'LMNOP12', model: 'elegy', fuel: 90, engine: 1000, body: 1000, state: 1, trunk: 0 },
                                    { name: 'Veículo', plate: 'QRS3T45', model: 'sultan', fuel: 45, engine: 750, body: 850, state: 1, trunk: 8 },
                                    { name: 'Veículo', plate: 'UVW6X78', model: 'kuruma', fuel: 100, engine: 1000, body: 1000, state: 1, trunk: 50 },
                                ]
                            }, '*');
                        }, 100);
                    }
                },

                selectVehicle(veh) {
                    this.selected = veh;
                },

                toggleSort() {
                    this.sortAsc = !this.sortAsc;
                },

                filteredVehicles() {
                    let list = this.vehicles;
                    if (this.search) {
                        const s = this.search.toLowerCase();
                        list = list.filter(v => 
                            (v.name && v.name.toLowerCase().includes(s)) || 
                            (v.plate && v.plate.toLowerCase().includes(s))
                        );
                    }
                    return list.slice().sort((a, b) => {
                        const nameA = (a.name || '').toLowerCase();
                        const nameB = (b.name || '').toLowerCase();
                        return this.sortAsc ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
                    });
                },

                canSpawn() {
                    if (this.isProcessing) return false;
                    if (!this.selected) return false;
                    if (this.isImpound) return true;
                    if (this.selected.isWork) return true;
                    return this.selected.state === 1;
                },

                getSpawnButtonText() {
                    if (this.isProcessing) return 'PROCESSANDO...';
                    if (this.isImpound) return 'PAGAR E RECUPERAR';
                    if (!this.selected) return 'RETIRAR VEÍCULO';
                    if (this.selected.isWork) return 'RETIRAR VIATURA / SERVIÇO';
                    if (this.selected.state === 0) return 'VEÍCULO FORA DA GARAGEM';
                    if (this.selected.state === 3) return 'VEÍCULO DESTRUÍDO';
                    return 'RETIRAR VEÍCULO';
                },

                canStore() {
                    if (this.isProcessing) return false;
                    if (!this.selected || this.isImpound) return false;
                    if (this.selected.isWork) return true;
                    if (this.selected.state === 1) return false;
                    return true;
                },

                getStoreButtonText() {
                    if (this.isProcessing) return 'PROCESSANDO...';
                    if (!this.selected) return 'GUARDAR VEÍCULO';
                    if (this.selected.isWork) return 'GUARDAR VIATURA / SERVIÇO';
                    if (this.selected.state === 1) return 'JÁ ESTÁ NA GARAGEM';
                    return 'GUARDAR VEÍCULO';
                },

                spawn() {
                    if (!this.selected || !this.canSpawn() || this.isProcessing) return;
                    this.isProcessing = true;
                    Nui.post('takeOutVehicle', { 
                        plate: this.selected.plate, 
                        garage: this.garageName,
                        price: this.selected.price,
                        model: this.selected.model,
                        name: this.selected.name,
                        isWork: this.selected.isWork
                    });
                    this.close();
                },

                trackVeh() {
                    if (!this.selected || this.isProcessing) return;
                    this.isProcessing = true;
                    Nui.post('trackVehicle', {
                        plate: this.selected.plate,
                        garage: this.garageName
                    });
                    this.close();
                },

                storeVeh() {
                    if (!this.selected || this.isProcessing) return;
                    this.isProcessing = true;
                    Nui.post('storeSelectedVehicle', {
                        plate: this.selected.plate,
                        garage: this.garageName
                    });
                    this.close();
                },

                close() {
                    this.isOpen = false;
                    this.isProcessing = false;
                    Nui.post('closeUI');
                }
            };
        }
    </script>
</body>
</html>
